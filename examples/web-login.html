<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custos SDK - Browser Example</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    button { padding: 10px 14px; margin-right: 8px; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Custos SDK - Browser Example</h1>
  <button id="loginBtn">Login</button>
  <button id="logoutBtn">Logout</button>
  <pre id="log"></pre>

  <script src="../dist/index.umd.js"></script>
  <script>
    const logEl = document.getElementById('log');
    const log = (msg, obj) => {
      logEl.textContent += obj ? msg + '\n' + JSON.stringify(obj, null, 2) + '\n\n' : msg + '\n';
    };

    const auth = new window.Custos.Custos({
      clientId: 'your-client-id',
      redirectUri: window.location.origin + window.location.pathname,
      apiUrl: 'https://custos.alimzen.com',
      scope: 'openid profile email',
      usePKCE: true,
      useSessionStorage: false,
    });

    auth.on('login', (event) => log('LOGIN OK', event.data));
    auth.on('logout', () => log('LOGOUT OK'));
    auth.on('session-restored', (event) => log('SESSION RESTORED', event.data));
    auth.on('error', (event) => log('AUTH ERROR', event.data));

    (async () => {
      const restored = await auth.silentAuth();
      if (restored) {
        log('Session restored at startup');
      }

      if (auth.hasCallbackParams()) {
        try {
          await auth.handleCallback();
          log('Callback processed');
        } catch (e) {
          log('Callback error', { message: e.message });
        }
      }
    })();

    document.getElementById('loginBtn').addEventListener('click', async () => {
      await auth.login();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await auth.logout();
    });
  </script>
</body>
</html>
