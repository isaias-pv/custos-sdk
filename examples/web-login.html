<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custos · ejemplo sin bundler</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #d4d4d8; background: #fff; cursor: pointer; }
    pre { background: #f4f4f5; padding: 12px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Custos</h1>
  <p id="status">Cargando…</p>
  <button id="login" hidden>Entrar</button>
  <button id="logout" hidden>Salir</button>
  <pre id="user" hidden></pre>

  <!-- Tras `pnpm build`; en producción: https://unpkg.com/@alimzen/custos/dist/custos.global.js -->
  <script src="../packages/custos/dist/custos.global.js"></script>
  <script>
    const custos = new Custos.Custos({
      clientId: 'tu-client-id',
      redirectUri: location.origin + location.pathname,
      issuer: 'http://localhost:3000',
    });

    const $ = (id) => document.getElementById(id);
    function render({ isAuthenticated, user }) {
      $('status').textContent = isAuthenticated ? `Hola, ${user.name ?? user.email}` : 'Sin sesión';
      $('login').hidden = isAuthenticated;
      $('logout').hidden = !isAuthenticated;
      $('user').hidden = !isAuthenticated;
      $('user').textContent = JSON.stringify(user, null, 2);
    }

    custos.subscribe(render);
    $('login').onclick = () => custos.login();
    $('logout').onclick = () => custos.logout();

    (async () => {
      try {
        if (custos.hasCallbackParams()) await custos.handleCallback();
        else await custos.restore();
      } catch (error) {
        $('status').textContent = `Error (${error.code}): ${error.message}`;
      }
      render(custos.getState());
    })();
  </script>
</body>
</html>
